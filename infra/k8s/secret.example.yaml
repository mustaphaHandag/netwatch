# Copie ce fichier en secret.yaml (ignore par git) et remplis les vraies valeurs
# avant de l'appliquer avec kubectl apply -f infra/k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: netwatch-db-secret
type: Opaque
stringData:
  db-url: "jdbc:postgresql://<CLOUD_SQL_IP>:5432/netwatch"
  db-user: "netwatch"
  db-password: "change-me"
