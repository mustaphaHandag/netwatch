# Identifiants locaux (kind/minikube) : valeurs jetables, non sensibles.
# Ne pas reutiliser en production - voir infra/k8s/secret.example.yaml pour Cloud SQL.
apiVersion: v1
kind: Secret
metadata:
  name: netwatch-db-secret
type: Opaque
stringData:
  db-url: "jdbc:postgresql://netwatch-postgres:5432/netwatch"
  db-user: "netwatch"
  db-password: "netwatch"
