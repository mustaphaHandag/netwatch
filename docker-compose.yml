version: "3.9"

services:
  netwatch:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/netwatch
      DB_USER: netwatch
      DB_PASSWORD: netwatch
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: netwatch
      POSTGRES_USER: netwatch
      POSTGRES_PASSWORD: netwatch
    ports:
      - "5432:5432"
    volumes:
      - netwatch-db-data:/var/lib/postgresql/data

volumes:
  netwatch-db-data:
